name: Deploy website and demo to GitHub Pages

# Publishes the landing page (website/) to https://<owner>.github.io/<repo>/
# and the app to https://<owner>.github.io/<repo>/app/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Safe to publish: no API keys are bundled (users bring their own key in Settings).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Served from a sub-path; follows the repo name if it is ever renamed
          VITE_BASE: /${{ github.event.repository.name }}/app/
          # Optional: your own CORS proxy for Paper Radar (see README)
          VITE_ARXIV_PROXY: ${{ vars.VITE_ARXIV_PROXY }}
      - name: Assemble site (landing page at root, app under /app/)
        run: |
          mkdir -p _site
          cp -R website/. _site/
          rm -f _site/README.md
          cp -R dist _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
