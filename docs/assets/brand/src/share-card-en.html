<!doctype html>
<!-- English share card (Open Graph / X / LinkedIn) · 1200x630 -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { width: 1200px; height: 630px; position: relative; background:
    radial-gradient(640px 420px at 0% 100%, rgba(242,180,92,.20), transparent 70%),
    radial-gradient(620px 480px at 100% 0%, rgba(247,211,161,.32), transparent 70%), var(--cream); }
  .left { position: absolute; left: 76px; top: 70px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 44px; height: 44px; }
  .brand span { font-size: 34px; font-weight: 600; }
  .eyebrow { margin-top: 44px; font-size: 16px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
  h1 { margin-top: 14px; font-size: 60px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; }
  p { margin-top: 22px; font-size: 21px; line-height: 1.55; color: var(--stone-600); max-width: 540px; }
  .chips { margin-top: 30px; display: flex; gap: 10px; }
  .story { position: absolute; left: 76px; bottom: 56px; font-size: 16px; color: var(--stone-500); }
  .story b { color: var(--stone-700); font-weight: 500; }
  .phone { position: absolute; width: 236px; border-radius: 38px; background: var(--stone-900); padding: 9px;
    box-shadow: 0 30px 60px rgba(28,25,23,.22), 0 6px 16px rgba(28,25,23,.08); }
  .phone img { display: block; width: 100%; border-radius: 30px; }
  .p1 { left: 720px; top: 66px; transform: rotate(-4deg); }
  .p2 { left: 920px; top: 96px; transform: rotate(4deg); }
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="../logo-mark.svg"><span class="serif">Sidonie</span></div>
    <div class="eyebrow">Open-source · local-first</div>
    <h1 class="serif">Built for my family first.</h1>
    <p>An AI learning companion that helps a child learn a little every day — and helps the grown-ups read, annotate and review research papers.</p>
    <div class="chips"><span class="chip"><span class="dot"></span>Help Child</span><span class="chip"><span class="dot"></span>Paper study</span><span class="chip"><span class="dot"></span>Your own API key</span></div>
  </div>
  <div class="story">Named after my wife, inspired by our child. — <b>Melon (李辉)</b></div>
  <div class="phone p1"><img src="../../../screenshots/mobile-help-child.png"></div>
  <div class="phone p2"><img src="../../../screenshots/mobile-quiz.png"></div>
</body></html>
