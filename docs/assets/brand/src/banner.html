<!doctype html>
<!-- README hero banner · 1280x400 -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { width: 1280px; height: 400px; background:
    radial-gradient(600px 300px at 12% 0%, rgba(242,180,92,.18), transparent 70%),
    radial-gradient(500px 300px at 100% 100%, rgba(247,211,161,.22), transparent 70%), var(--cream); position: relative; }
  .left { position: absolute; left: 72px; top: 50px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 56px; height: 56px; }
  .brand span { font-size: 46px; font-weight: 600; letter-spacing: -0.01em; }
  h1 { margin-top: 26px; font-size: 38px; line-height: 1.18; font-weight: 600; letter-spacing: -0.015em; }
  h1 em { font-style: normal; color: var(--amber); }
  p { margin-top: 16px; font-size: 18px; line-height: 1.55; color: var(--stone-600); max-width: 520px; }
  .chips { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
  .shot { position: absolute; right: -40px; top: 54px; width: 640px; transform: rotate(-2deg); }
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="../logo-mark.svg"><span class="serif">Sidonie</span></div>
    <h1 class="serif">An AI learning companion<br>for <em>families</em>.</h1>
    <p>Help your child learn a little every day, keep research within reach — all in your browser, with your own API key.</p>
    <div class="chips"><span class="chip"><span class="dot"></span>Local-first</span><span class="chip"><span class="dot"></span>Bring your own key</span><span class="chip"><span class="dot"></span>Open source · MIT</span></div>
  </div>
  <div class="shot window"><div class="bar"><i></i><i></i><i></i></div><img src="../../../screenshots/help-child.png"></div>
</body></html>
