<!doctype html>
<!-- GitHub social preview · 1280x640 (Settings -> General -> Social preview) -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { width: 1280px; height: 640px; position: relative; background:
    radial-gradient(700px 420px at 0% 0%, rgba(242,180,92,.20), transparent 70%),
    radial-gradient(700px 500px at 100% 100%, rgba(247,211,161,.26), transparent 70%), var(--cream); }
  .left { position: absolute; left: 80px; top: 92px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 60px; height: 60px; }
  .brand span { font-size: 48px; font-weight: 600; }
  .brand .sep { width: 2px; height: 30px; background: var(--stone-300); border-radius: 2px; margin: 0 2px; }
  .brand .zh { font-family: 'Songti SC', 'STSong', serif; font-weight: 700; font-size: 36px; letter-spacing: .04em; color: var(--stone-700); }
  h1 { margin-top: 40px; font-size: 58px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: var(--amber); }
  ul { list-style: none; margin-top: 36px; display: grid; gap: 16px; }
  li { display: flex; gap: 14px; align-items: baseline; font-size: 20px; color: var(--stone-600); line-height: 1.4; }
  li b { color: var(--stone-900); font-weight: 600; white-space: nowrap; }
  li .dot { flex: none; transform: translateY(-3px); }
  .foot { position: absolute; left: 80px; bottom: 54px; font-size: 16px; color: var(--stone-500); display: flex; gap: 18px; }
  .shot { position: absolute; left: 690px; top: 70px; width: 720px; }
  .quiz { position: absolute; left: 640px; top: 330px; width: 400px; border-radius: 16px; overflow: hidden;
    border: 1px solid var(--stone-200); box-shadow: 0 20px 50px rgba(28,25,23,.18), 0 4px 12px rgba(28,25,23,.06); background: #fff; }
  .quiz img { display: block; width: 100%; }
  .rabbit { right: 34px; bottom: 0; width: 250px; z-index: 2; }
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="../logo-mark.svg"><span class="serif">Sidonie</span><i class="sep"></i><span class="zh">伴学</span></div>
    <h1 class="serif">An AI learning<br>companion for <em>families</em>.</h1>
    <ul>
      <li><span class="dot"></span><span><b>Help Child</b> — curriculum, quizzes, spaced review</span></li>
      <li><span class="dot"></span><span><b>Paper study</b> — read, annotate, review, cite</span></li>
      <li><span class="dot"></span><span><b>Private by design</b> — local-first, your own key</span></li>
    </ul>
  </div>
  <div class="foot"><span>Open source · MIT</span><span>github.com/melonlee/sidonie</span></div>
  <div class="shot window"><div class="bar"><i></i><i></i><i></i></div><img src="../../../screenshots/help-child.png"></div>
  <div class="quiz"><img src="img/quiz-card-en.png"></div>
  <img class="rabbit" src="../mascot-rise.svg" alt="">
</body></html>
