  </linearGradient>
  <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a6a4e" stop-opacity="0"/><stop offset="0.5" stop-color="#8a6a4e" stop-opacity="0.45"/><stop offset="1" stop-color="#8a6a4e" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0.35" stop-color="#ffc56e" stop-opacity="0.55"/><stop offset="1" stop-color="#e79a3b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#fbe7c6"/>
  </linearGradient>
  <radialGradient id="star" cx="0.4" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#ffd18a"/><stop offset="0.6" stop-color="#e79a3b"/><stop offset="1" stop-color="#cf7f25"/>
  </radialGradient>
