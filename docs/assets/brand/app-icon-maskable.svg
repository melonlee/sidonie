  </radialGradient>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#efe4d4"/>
  </linearGradient>
  <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6ede0"/><stop offset="1" stop-color="#e2d4c1"/>
